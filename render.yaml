services:
  - type: web
    name: ivi-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/status/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "ivi-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://ivi-web.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://ivi-web.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: DATABASE_URL
        sync: false

  - type: web
    name: ivi-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: "https://ivi-api.onrender.com/api"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
