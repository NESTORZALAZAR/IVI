<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
<style>text{font-family:Arial,sans-serif;fill:#26384e}.title{font-size:30px;font-weight:700}.h{font-size:18px;font-weight:700}.i{font-size:13px}.c{fill:#fff;stroke:#416b9b;stroke-width:2}.head{fill:#dcecff}.line{stroke:#7892ad;stroke-width:2;fill:none}</style>
<rect width="1500" height="900" fill="#f5f8fc"/><text x="45" y="50" class="title">Diccionario de datos IVI - esquema actual</text>
<path d="M270 180H370M630 180H730M990 180H1090M860 330V430M630 535H730M990 535H1090M270 770H370" class="line"/>
<g transform="translate(40 100)"><rect width="230" height="190" class="c"/><rect width="230" height="45" class="head"/><text x="115" y="29" text-anchor="middle" class="h">User</text><text x="15" y="78" class="i">id, username, email</text><text x="15" y="108" class="i">password, nombres</text><text x="15" y="138" class="i">Django Auth</text></g>
<g transform="translate(370 100)"><rect width="260" height="190" class="c"/><rect width="260" height="45" class="head"/><text x="130" y="29" text-anchor="middle" class="h">Profile</text><text x="15" y="78" class="i">user_id UNIQUE</text><text x="15" y="108" class="i">role CHECK</text><text x="15" y="138" class="i">0..1 desde User</text></g>
<g transform="translate(730 100)"><rect width="260" height="230" class="c"/><rect width="260" height="45" class="head"/><text x="130" y="29" text-anchor="middle" class="h">Paciente</text><text x="15" y="78" class="i">profile_id UNIQUE</text><text x="15" y="108" class="i">ci UNIQUE nullable</text><text x="15" y="138" class="i">age</text><text x="15" y="168" class="i">is_office_patient</text></g>
<g transform="translate(1090 100)"><rect width="300" height="230" class="c"/><rect width="300" height="45" class="head"/><text x="150" y="29" text-anchor="middle" class="h">Profesional</text><text x="15" y="78" class="i">profile_id UNIQUE</text><text x="15" y="108" class="i">license_number UNIQUE</text><text x="15" y="138" class="i">specialty, institution</text></g>
<g transform="translate(370 430)"><rect width="260" height="210" class="c"/><rect width="260" height="45" class="head"/><text x="130" y="29" text-anchor="middle" class="h">TipoPrueba</text><text x="15" y="78" class="i">codigo UNIQUE</text><text x="15" y="108" class="i">nombre, categoria</text><text x="15" y="138" class="i">activo</text></g>
<g transform="translate(730 430)"><rect width="260" height="250" class="c"/><rect width="260" height="45" class="head"/><text x="130" y="29" text-anchor="middle" class="h">ResultadoPrueba</text><text x="15" y="78" class="i">paciente_id, prueba_id</text><text x="15" y="108" class="i">puntaje 0..100</text><text x="15" y="138" class="i">fecha_prueba, duracion</text><text x="15" y="168" class="i">estado, detalles JSON</text></g>
<g transform="translate(1090 430)"><rect width="300" height="210" class="c"/><rect width="300" height="45" class="head"/><text x="150" y="29" text-anchor="middle" class="h">RespuestaResultado</text><text x="15" y="78" class="i">resultado_id, clave</text><text x="15" y="108" class="i">respuesta JSON</text><text x="15" y="138" class="i">puntaje 0..100</text></g>
<g transform="translate(370 700)"><rect width="260" height="150" class="c"/><rect width="260" height="45" class="head"/><text x="130" y="29" text-anchor="middle" class="h">ArchivoProcesado</text><text x="15" y="78" class="i">propietario nullable</text><text x="15" y="108" class="i">nombre, MIME, texto</text></g>
<g transform="translate(730 700)"><rect width="260" height="150" class="c"/><rect width="260" height="45" class="head"/><text x="130" y="29" text-anchor="middle" class="h">ConversionAudio</text><text x="15" y="78" class="i">archivo_id, velocidad</text><text x="15" y="108" class="i">formato, creado_en</text></g>
<text x="45" y="875" class="i">ResultadoPrueba pertenece a Paciente; User-Profile es 0..1 desde User.</text>
</svg>
