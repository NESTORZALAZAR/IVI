<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><style>text{font-family:Arial,sans-serif;fill:#26384e}.title{font-size:31px;font-weight:700}.h{font-size:20px;font-weight:700}.item{font-size:17px}.step{fill:#e4f1ea;stroke:#88b89b;stroke-width:2;rx:18}.num{fill:#416b9b}</style></defs><rect width="1200" height="700" fill="#f6faf7"/><text x="55" y="60" class="title">Ruta recomendada para la defensa</text><g><rect x="85" y="135" width="250" height="105" class="step"/><circle cx="125" cy="185" r="24" class="num"/><text x="125" y="192" text-anchor="middle" fill="white" font-size="18">1</text><text x="165" y="180" class="h">Problema</text><text x="165" y="210" class="item">Barreras de lectura</text><rect x="475" y="135" width="250" height="105" class="step"/><circle cx="515" cy="185" r="24" class="num"/><text x="515" y="192" text-anchor="middle" fill="white" font-size="18">2</text><text x="555" y="180" class="h">Propuesta</text><text x="555" y="210" class="item">Apoyo accesible</text><rect x="865" y="135" width="250" height="105" class="step"/><circle cx="905" cy="185" r="24" class="num"/><text x="905" y="192" text-anchor="middle" fill="white" font-size="18">3</text><text x="945" y="180" class="h">Demostración</text><text x="945" y="210" class="item">Flujo de usuario</text><rect x="280" y="360" width="250" height="105" class="step"/><circle cx="320" cy="410" r="24" class="num"/><text x="320" y="417" text-anchor="middle" fill="white" font-size="18">4</text><text x="360" y="405" class="h">Arquitectura</text><text x="360" y="435" class="item">DER y casos de uso</text><rect x="670" y="360" width="250" height="105" class="step"/><circle cx="710" cy="410" r="24" class="num"/><text x="710" y="417" text-anchor="middle" fill="white" font-size="18">5</text><text x="750" y="405" class="h">Cierre</text><text x="750" y="435" class="item">Alcance no diagnostico</text></g><text x="600" y="590" text-anchor="middle" class="h">IVI reduce barreras y facilita el acompanamiento temprano.</text></svg>