<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1000" viewBox="0 0 1300 1000">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7892ad"/></marker>
    <style>
      text{font-family:Arial,sans-serif;fill:#26384e}.title{font-size:30px;font-weight:700}.h{font-size:18px;font-weight:700}.field{font-size:13px}.entity{fill:#fff;stroke:#416b9b;stroke-width:2}.head{fill:#dcecff}.rel{stroke:#7892ad;stroke-width:2;fill:none;marker-end:url(#arrow)}.label{font-size:12px;fill:#526a80}
    </style>
  </defs>
  <rect width="1300" height="1000" fill="#f5f8fc"/>
  <text x="42" y="50" class="title">DER IVI - Relaciones normalizadas</text>

  <!-- Nivel 1: identidad -->
  <g transform="translate(40 100)"><rect width="260" height="190" class="entity"/><rect width="260" height="45" class="head"/><text x="130" y="29" text-anchor="middle" class="h">USER</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">username</text><text x="18" y="125" class="field">email</text><text x="18" y="150" class="field">password</text><text x="18" y="175" class="field">Django Auth</text></g>
  <g transform="translate(390 100)"><rect width="260" height="190" class="entity"/><rect width="260" height="45" class="head"/><text x="130" y="29" text-anchor="middle" class="h">PROFILE</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">FK user_id UNIQUE</text><text x="18" y="125" class="field">role CHECK</text><text x="18" y="150" class="field">admin / doctor / paciente</text></g>

  <!-- Nivel 2: extensiones del perfil -->
  <g transform="translate(780 70)"><rect width="270" height="210" class="entity"/><rect width="270" height="45" class="head"/><text x="135" y="29" text-anchor="middle" class="h">PACIENTE</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">FK profile_id UNIQUE</text><text x="18" y="125" class="field">ci UNIQUE nullable</text><text x="18" y="150" class="field">age</text><text x="18" y="175" class="field">is_office_patient</text></g>
  <g transform="translate(780 350)"><rect width="270" height="210" class="entity"/><rect width="270" height="45" class="head"/><text x="135" y="29" text-anchor="middle" class="h">PROFESIONAL</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">FK profile_id UNIQUE</text><text x="18" y="125" class="field">license_number UNIQUE</text><text x="18" y="150" class="field">specialty</text><text x="18" y="175" class="field">institution</text></g>

  <!-- Nivel 3: evaluaciones -->
  <g transform="translate(40 470)"><rect width="270" height="210" class="entity"/><rect width="270" height="45" class="head"/><text x="135" y="29" text-anchor="middle" class="h">TIPO_PRUEBA</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">codigo UNIQUE</text><text x="18" y="125" class="field">nombre</text><text x="18" y="150" class="field">categoria</text><text x="18" y="175" class="field">activo</text></g>
  <g transform="translate(390 470)"><rect width="270" height="250" class="entity"/><rect width="270" height="45" class="head"/><text x="135" y="29" text-anchor="middle" class="h">RESULTADO_PRUEBA</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">FK paciente_id</text><text x="18" y="125" class="field">FK prueba_id</text><text x="18" y="150" class="field">puntaje 0..100</text><text x="18" y="175" class="field">fecha_prueba</text><text x="18" y="200" class="field">duracion</text><text x="18" y="225" class="field">estado / detalles JSON</text></g>
  <g transform="translate(780 650)"><rect width="270" height="210" class="entity"/><rect width="270" height="45" class="head"/><text x="135" y="29" text-anchor="middle" class="h">RESPUESTA_RESULTADO</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">FK resultado_id</text><text x="18" y="125" class="field">clave UNIQUE por resultado</text><text x="18" y="150" class="field">respuesta JSON</text><text x="18" y="175" class="field">puntaje 0..100</text></g>

  <!-- Nivel 4: lector -->
  <g transform="translate(40 810)"><rect width="270" height="150" class="entity"/><rect width="270" height="45" class="head"/><text x="135" y="29" text-anchor="middle" class="h">ARCHIVO_PROCESADO</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">FK propietario_id nullable</text><text x="18" y="125" class="field">nombre / MIME / texto</text></g>
  <g transform="translate(390 810)"><rect width="270" height="150" class="entity"/><rect width="270" height="45" class="head"/><text x="135" y="29" text-anchor="middle" class="h">CONVERSION_AUDIO</text><text x="18" y="75" class="field">PK id</text><text x="18" y="100" class="field">FK archivo_id</text><text x="18" y="125" class="field">velocidad / formato</text></g>

  <!-- Relaciones ortogonales sin cruces -->
  <path class="rel" d="M300 195 H390"/><text x="330" y="185" class="label">0..1</text>
  <path class="rel" d="M650 160 H780"/><text x="700" y="150" class="label">0..1</text>
  <path class="rel" d="M650 250 H680 V455 H780"/><text x="665" y="275" class="label">0..1</text>
  <path class="rel" d="M780 180 H720 V430 H600 V470"/><text x="725" y="350" class="label">0..N</text>
  <path class="rel" d="M310 575 H390"/><text x="335" y="565" class="label">1:N</text>
  <path class="rel" d="M660 610 H700 V755 H780"/><text x="675" y="635" class="label">0..N</text>
  <path class="rel" d="M40 195 H15 V885 H40"/><text x="18" y="540" class="label">0..N</text>
  <path class="rel" d="M310 885 H390"/><text x="335" y="875" class="label">0..N</text>
</svg>
